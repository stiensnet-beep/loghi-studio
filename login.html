<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="darkreader-lock">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Loghi-studio</title>
<style>
:root {
  color-scheme: dark;
  --bg: oklch(15.5% .012 265); --panel: oklch(21.5% .022 264); --field: oklch(18.5% .02 264);
  --ink: oklch(95% .004 250); --muted: oklch(77% .02 260); --line: oklch(100% 0 0 / .13); --edge: oklch(100% 0 0 / .30);
  --accent: oklch(78% .12 92); --on-accent: oklch(15.5% .012 265);
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--ink);
  font: 1rem/1.55 Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
main { width: 100%; max-width: 26rem; background: var(--panel); border: 1px solid var(--line); border-radius: .75rem; padding: 1.6rem; }
h1 { margin: 0 0 .2rem; font-size: 1.9rem; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: .45em; letter-spacing: .02em; }
h1 .thin { font-weight: 300; }
h1 svg { width: 1.25em; height: 1.25em; flex: none; fill: var(--accent); transform: rotate(-24deg); }
p { margin: .3rem 0 1.1rem; color: var(--muted); }
label { display: block; margin: .9rem 0 .25rem; color: var(--muted); font-weight: 500; }
input, button, select { font: inherit; color: inherit; min-height: 2.8rem; border-radius: .5rem; }
input, select { width: 100%; background: var(--field); border: 1px solid var(--edge); padding: .4rem .7rem; }
button { width: 100%; margin-top: 1.3rem; background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
:focus-visible { outline: .18rem solid var(--accent); outline-offset: .15rem; }
#error { margin: 1rem 0 0; padding: .5rem .8rem; border: 1px solid var(--edge); border-left: .5rem solid var(--accent); border-radius: .5rem; color: var(--ink); font-weight: 600; }
#error:empty, #forgot-done:empty { display: none; }
#forgot-done { margin: 1rem 0 0; padding: .5rem .8rem; border: 1px solid var(--edge); border-left: .5rem solid var(--accent); border-radius: .5rem; color: var(--ink); font-weight: 600; }
button.plain { background: none; color: var(--ink); border: 1px solid var(--edge); font-weight: 500; }
#forgot { margin-top: 1rem; }
.lang { margin-top: 1.4rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 91C28 91 5 68 5 38 5 19 18 7 31 7c7 0 11 2 14 6l5 35 5-35c3-4 7-6 14-6 13 0 26 12 26 31 0 30-23 53-45 53z"/></svg><span>Loghi<span class="thin">-studio</span></span></h1>
  <p id="t-slogan">Oude Friese handschriften, leesbaar en doorzoekbaar</p>
  <form id="form">
    <label for="user" id="t-user">Naam</label>
    <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password" id="t-password">Wachtwoord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="t-submit">Inloggen</button>
    <div id="error" role="alert"></div>
  </form>
  <button type="button" class="plain" id="t-forgot" aria-expanded="false" aria-controls="forgot"></button>
  <form id="forgot" hidden>
    <p id="t-forgotText"></p>
    <label for="forgot-user" id="t-forgotUser"></label>
    <input id="forgot-user" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <button type="submit" id="t-forgotSend"></button>
    <div id="forgot-done" role="status"></div>
  </form>
  <div class="lang">
    <label for="lang" class="sr" id="t-lang">Taal</label>
    <select id="lang"><option value="nl" lang="nl">Nederlands</option><option value="fy" lang="fy">Frysk</option><option value="en" lang="en">English</option></select>
  </div>
</main>
<script>
const TEXT = {
  nl: { slogan: "Oude Friese handschriften, leesbaar en doorzoekbaar", user: "Naam", password: "Wachtwoord", submit: "Inloggen", lang: "Taal",
        wrong: "De naam of het wachtwoord klopt niet.", wait: "Te veel foute pogingen. Wacht 15 minuten en probeer het opnieuw.", slow: "Te veel foute pogingen voor deze naam. Wacht een paar seconden en probeer het opnieuw.", fail: "Inloggen is nu niet gelukt. Probeer het later opnieuw.",
        forgot: "Wachtwoord vergeten?", forgotSend: "Nieuw wachtwoord aanvragen",
        forgotText: "Vul je naam in. De beheerder ziet dan dat je een nieuw wachtwoord vraagt en geeft je dat zelf door. Er wordt geen e-mail verstuurd.",
        forgotDone: "Je vraag is doorgegeven, als deze naam bestaat. Je krijgt het nieuwe wachtwoord van de beheerder." },
  fy: { slogan: "Alde Fryske hânskriften, lêsber en trochsykber", user: "Namme", password: "Wachtwurd", submit: "Ynlogge", lang: "Taal",
        wrong: "De namme of it wachtwurd kloppet net.", wait: "Tefolle ferkearde besykjen. Wachtsje 15 minuten en besykje it opnij.", slow: "Tefolle ferkearde besykjen foar dizze namme. Wachtsje in pear sekonden en besykje it opnij.", fail: "Ynloggen is no net slagge. Besykje it letter opnij.",
        forgot: "Wachtwurd fergetten?", forgotSend: "Nij wachtwurd oanfreegje",
        forgotText: "Folje jo namme yn. De behearder sjocht dan dat jo in nij wachtwurd freegje en jout jo dat sels troch. Der wurdt gjin e-mail ferstjoerd.",
        forgotDone: "Jo fraach is trochjûn, as dizze namme bestiet. Jo krije it nije wachtwurd fan de behearder." },
  en: { slogan: "Old Frisian handwriting, readable and searchable", user: "Name", password: "Password", submit: "Log in", lang: "Language",
        wrong: "The name or the password is not right.", wait: "Too many wrong attempts. Wait 15 minutes and try again.", slow: "Too many wrong attempts for this name. Wait a few seconds and try again.", fail: "Logging in did not work just now. Try again later.",
        forgot: "Forgot your password?", forgotSend: "Ask for a new password",
        forgotText: "Type your name. The administrator then sees that you ask for a new password and passes it on to you. No e-mail is sent.",
        forgotDone: "Your request was passed on, if this name exists. You will get the new password from the administrator." },
};
const $ = id => document.getElementById(id);
let lang = /^fy/i.test(navigator.language || "") ? "fy" : /^nl/i.test(navigator.language || "") ? "nl" : "en";
try { const v = JSON.parse(localStorage.getItem("ls.lang")); if (TEXT[v]) lang = v; } catch {}
function show() {
  document.documentElement.lang = lang; $("lang").value = lang;
  for (const k of ["slogan", "user", "password", "submit", "lang", "forgot", "forgotText", "forgotSend"]) $("t-" + k).textContent = TEXT[lang][k];
  $("t-forgotUser").textContent = TEXT[lang].user;
}
show();
$("lang").onchange = () => { lang = $("lang").value; try { localStorage.setItem("ls.lang", JSON.stringify(lang)); } catch {} $("error").textContent = ""; show(); };
$("t-forgot").onclick = () => {
  const open = $("forgot").hidden; $("forgot").hidden = !open; $("t-forgot").setAttribute("aria-expanded", open);
  if (open) { $("forgot-user").value = $("user").value; $("forgot-done").textContent = ""; $("forgot-user").focus(); }
};
$("forgot").onsubmit = async e => {
  e.preventDefault();
  $("forgot-done").textContent = "";
  try { await fetch("api/forgot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: $("forgot-user").value }) }); } catch {}
  $("forgot-done").textContent = TEXT[lang].forgotDone;      // the same answer whether the name exists or not
};
$("form").onsubmit = async e => {
  e.preventDefault();
  $("error").textContent = ""; $("t-submit").disabled = true;
  try {
    const r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: $("user").value, password: $("password").value }) });
    if (r.ok) { location.reload(); return; }
    $("error").textContent = TEXT[lang][r.status === 401 ? "wrong" : r.status === 429 ? (r.headers.get("Retry-After") ? "slow" : "wait") : "fail"];
    $("password").value = ""; $("password").focus();
  } catch { $("error").textContent = TEXT[lang].fail; }
  $("t-submit").disabled = false;
};
</script>
</body>
</html>
